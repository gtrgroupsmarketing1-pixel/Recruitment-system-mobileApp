name: EAS Build (Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Queue EAS Android (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    env:
      # Must be set as a repo secret: Settings → Secrets → Actions → EXPO_TOKEN
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Verify EXPO_TOKEN is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty. Add it at:"
            echo "https://github.com/gtrgroupsmarketing1-pixel/Recruitment-system-mobileApp/settings/secrets/actions"
            echo "Create token at: https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is set (length ${#EXPO_TOKEN})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue EAS build (non-interactive)
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

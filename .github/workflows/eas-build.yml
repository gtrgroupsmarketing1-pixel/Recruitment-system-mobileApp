name: EAS Build (Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Queue EAS Android (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    env:
      # Repo secret is named EXPO_ACCESS_TOKEN (Settings → Secrets → Actions)
      EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
    steps:
      - name: Verify Expo token secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_ACCESS_TOKEN is empty or missing."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Name must be exactly: EXPO_ACCESS_TOKEN"
            echo "Value: Expo access token from https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "Expo token is set (length ${#EXPO_TOKEN})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Queue EAS build (non-interactive)
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

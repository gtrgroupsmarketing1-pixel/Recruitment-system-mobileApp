name: EAS Build (Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Queue EAS Android (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    env:
      # Repo secret is named GIT (Settings → Secrets → Actions)
      EXPO_TOKEN: ${{ secrets.GIT }}
    steps:
      - name: Verify Expo token secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret GIT is empty. Name must be exactly: GIT"
            exit 1
          fi
          echo "Expo token is set (length ${#EXPO_TOKEN})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.GIT }}

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Queue EAS build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
